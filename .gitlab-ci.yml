stages:
  - stop_app
  - install_packages
  - update_code
  - restore_renv
  - start_app
  - notify
  - notify_fail

stop_app:
  stage: stop_app
  tags:
    - rpup_pak_updater
  script:
    - nssm stop AnalyticsTaskManagerApp
  only:
    - master
  dependencies: []

deploy_packages:
  stage: install_packages
  tags:
    - rpup_pak_updater
  script:
    - Rscript --vanilla -e "install.packages(c('ps', 'purrr', 'telegram.bot', 'dplyr', 'httr2'), repos='https://cran.r-project.org')"
    - Rscript --vanilla -e "install.packages(c('glue', 'renv','R6','rlang','jsonlite'), repos='https://cran.r-project.org')"
  only:
    - master
  dependencies:
    - stop_app

update_code:
  stage: update_code
  tags:
    - rpup_pak_updater
  script:
    - cd C:\scripts\alsey\netpeak_core\nc_analytics_team\shiny_task_service_manager
    - powershell -Command "Get-ChildItem -Path . -Filter 'desktop.ini' -Recurse -Force -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue"
    - git -c safe.directory="*" reset --hard
    - git -c safe.directory="*" pull origin master
  only:
    - master
  dependencies:
    - deploy_packages
    
restore_renv:
  stage: restore_renv
  tags:
    - rpup_pak_updater
  script:
    - cd C:\scripts\alsey\netpeak_core\nc_analytics_team\shiny_task_service_manager
    - Rscript --vanilla -e "source('renv/activate.R'); renv::restore(prompt = FALSE)"
  only:
    - master
  dependencies:
    - update_code

start_app:
  stage: start_app
  tags:
    - rpup_pak_updater
  script:
    - nssm start AnalyticsTaskManagerApp
  only: 
    - master
  dependencies:
    - restore_renv

notify:
  stage: notify
  when: on_success
  tags:
    - rpup_pak_updater
  script:
    - Rscript --vanilla ci_command/success.R
  only:
    - master
  dependencies:
    - start_app

notify_fail:
  stage: notify_fail
  script:
    - Rscript --vanilla ci_command/fail.R
  when: on_failure
  only:
    - master
  tags:
    - rpup_pak_updater
  dependencies: []
